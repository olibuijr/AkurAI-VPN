[workspace]
resolver = "2"
members = ["crates/akurai-common", "crates/akurai-crypto", "crates/akurai-transport", "crates/akurai-control", "crates/akurai-node", "crates/akurai-relay", "crates/akurai-admin", "crates/akurai-dns"]

# AkurAI-VPN: a secure, one-touch mesh VPN overlay built pure-Rust with ZERO
# runtime dependencies. The shipped binaries link NO third-party crates —
# `std` only — the same principle as AkurAI-Framework. Dev/test tooling is
# allowed only when it never ends up in a binary.
#
# DECISION RESOLVED (2026-06-27, Ólafur): the data-plane cryptography is
# implemented FROM SCRATCH in pure Rust — std only, no vetted crate
# (quinn/rustls/snow/ed25519) — to preserve the zero-dependency identity. The
# primitives live in `crates/akurai-crypto` and are each verified against their
# official RFC test vectors. The hand-rolled-crypto risk is accepted deliberately.

[workspace.package]
version = "0.0.7"
edition = "2021"
license = "MIT"
repository = "https://github.com/olibuijr/AkurAI-VPN"
authors = ["Ólafur Búi Ólafsson"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
