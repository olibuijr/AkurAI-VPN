[package]
name = "akurai-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "AkurAI VPN node daemon: host-only node install and membership state. No subnet or exit routing by default."

[[bin]]
name = "akurai-node"
path = "src/main.rs"

# Workspace pure-std crate only. The TUN device and packet transport are stubs;
# no external runtime dependency is linked.
[dependencies]
akurai-common = { path = "../akurai-common" }
