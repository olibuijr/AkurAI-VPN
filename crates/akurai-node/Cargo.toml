[package]
name = "akurai-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "AkurAI VPN node daemon: TUN device, route application, peer-map watch, gateway modes (0.0.1 skeleton)."

