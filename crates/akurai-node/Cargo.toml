[package]
name = "akurai-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "AkurAI VPN node daemon: host-only node install and membership state. No subnet or exit routing by default."

[[bin]]
name = "akurai-node"
path = "src/main.rs"

# Workspace pure-std crate only. The TUN device and packet transport are stubs;
# no external runtime dependency is linked. The data plane links only sibling
# AkurAI crates: akurai-sys (TUN ioctl), akurai-crypto (X25519 identity),
# akurai-transport (Noise_IK sessions), akurai-common (frame/overlay/base64).
[dependencies]
akurai-common = { path = "../akurai-common" }
akurai-crypto = { path = "../akurai-crypto" }
akurai-transport = { path = "../akurai-transport" }
akurai-sys = { path = "../akurai-sys" }
akurai-dns = { path = "../akurai-dns" }
