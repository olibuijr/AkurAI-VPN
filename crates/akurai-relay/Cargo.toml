[package]
name = "akurai-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "AkurAI VPN relay: ciphertext-only packet forwarding fallback (0.0.1 skeleton)."

[[bin]]
name = "akurai-relay"
path = "src/main.rs"

# Pure std. The relay only forwards opaque ciphertext; it links no crypto crate
# and holds no payload keys. It depends on akurai-common solely for the frame
# envelope codec (which carries no keys).
[dependencies]
akurai-common = { path = "../akurai-common" }
